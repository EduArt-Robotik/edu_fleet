name: snackbot-slam

services:
    snackbot-slam:
        image: eduartrobotik/eduart-fleet:0.4.0
        container_name: snackbot-slam-0.4.0
        user: user
        privileged: true
        ipc: host
        pid: host
        environment:
            - EDU_ROBOT_NAMESPACE=${EDU_ROBOT_NAMESPACE}
            - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
            - CYCLONEDDS_URI=/home/user/ros/launch_content/cyclone_dds_profile.xml
            - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
        network_mode: "host"
        command: bash -c 'cd /home/user/ros/launch_content; ros2 launch slam.launch.py'
        volumes:
            - './launch_content:/home/user/ros/launch_content:rw'
